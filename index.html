<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPACE GUO Knowledge Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--g:#023a25;--ink:#151816;--bg:#f3f2ed;--card:#fff;--line:#d8d8d0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(2,58,37,.96);color:white;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px #0002}.brand{font-weight:800;letter-spacing:.08em}.sub{font-size:11px;opacity:.7}
main{max-width:1100px;margin:auto;padding:14px}.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,.filebtn{border:0;border-radius:10px;padding:10px 13px;background:#e7e7df;color:#172019;font-weight:700;font-size:14px}.primary,.filebtn{background:var(--g);color:white}.filebtn input{display:none}
#status{font-size:12px;color:#666;flex:1;min-width:150px}.stage{background:#292b2a;border-radius:16px;min-height:68vh;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:12px}
canvas{display:block;background:white;box-shadow:0 4px 24px #0006;max-width:100%;height:auto}.bottom{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px}.page{font-variant-numeric:tabular-nums;font-weight:700}
.note{background:white;border-radius:16px;padding:12px;margin-top:12px}.note textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
@media(max-width:600px){main{padding:8px}.stage{border-radius:12px;padding:6px;min-height:64vh}.toolbar{border-radius:12px}.brand{font-size:14px}}
.home{max-width:1100px;margin:auto;padding:22px 14px 100px}.hero{background:var(--g);color:white;border-radius:24px;padding:30px 24px;margin-bottom:18px}.hero small{opacity:.7;letter-spacing:.12em}.hero h1{font-size:38px;line-height:1.08;margin:10px 0}.hero p{opacity:.78;line-height:1.6}.home-actions{display:flex;gap:8px;flex-wrap:wrap}.home-actions button{background:white;color:var(--g)}.continue-card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.continue-card h3{margin:5px 0 12px;font-size:22px}.progress{height:7px;background:#e7e7df;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--g)}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.bottomnav button{min-width:78px;background:transparent}.bottomnav button.active{color:var(--g);background:#edf2ee}.hidden{display:none!important}@media(max-width:600px){.hero h1{font-size:34px}.home{padding:14px 10px 90px}}
</style></head><body>
<header><div><div class="brand">SPACE GUO KNOWLEDGE</div><div class="sub">Read · Listen · Think · Connect</div></div></header>
<section id="home" class="home"><div class="hero"><small>SPACE GUO KNOWLEDGE</small><h1>읽고, 생각하고,<br>공간구오의 지식으로.</h1><p>책과 자료를 읽으며 메모하고, 앞으로 Obsidian과 AI 지식 시스템으로 연결하는 개인 서재입니다.</p><div class="home-actions"><button onclick="openReaderPicker()">+ PDF 추가</button><button onclick="showReader()">이어 읽기</button></div></div><div class="continue-card"><small>최근 읽던 책</small><h3 id="homeBook">PDF를 추가해 시작하세요</h3><div class="progress"><i id="homeProgress"></i></div><p id="homeMeta">아직 열린 책이 없습니다.</p></div></section>
<main id="reader" class="hidden"><div class="toolbar">
<label class="filebtn">PDF 열기<input id="file" type="file" accept="application/pdf"></label>
<button id="fit">화면 맞춤</button><button id="width">너비 맞춤</button><button id="ocr" class="primary">OCR 텍스트 변환</button>
<button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button>
<span id="status">PDF를 선택하세요.</span></div>
<div class="stage" id="stage"><canvas id="canvas"></canvas></div>
<div class="bottom"><button id="prev">‹ 이전</button><span class="page" id="page">0 / 0</span><button id="next">다음 ›</button></div>
<div class="note"><b>현재 페이지 메모</b><textarea id="note" placeholder="읽으면서 떠오른 생각을 기록하세요. 기기에 자동 저장됩니다."></textarea></div>
<section id="textView" class="home hidden"><div class="continue-card"><small>OCR / PDF 텍스트</small><h3>텍스트 읽기</h3><div id="ocrStatus" style="font-size:13px;color:#666;margin-bottom:12px">PDF를 연 뒤 OCR 텍스트 변환을 눌러주세요.</div><article id="ocrText" style="font-size:18px;line-height:1.9;white-space:pre-wrap;word-break:keep-all"></article><div style="margin-top:16px"><button onclick="showReader()">원본 PDF로 돌아가기</button></div></div></section></main><nav class="bottomnav"><button id="navHome" class="active" onclick="showHome()">⌂<br>서재</button><button id="navRead" onclick="showReader()">▤<br>읽기</button><button disabled>▶<br>듣기</button><button disabled>✦<br>AI</button></nav>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf=null,p=1,scale=1.15,rendering=false,pending=false,bytes=null,key='',mode='fit';
const $=id=>document.getElementById(id), canvas=$('canvas'), stage=$('stage');
function showHome(){$('textView').classList.add('hidden');$('home').classList.remove('hidden');$('reader').classList.add('hidden');$('navHome').classList.add('active');$('navRead').classList.remove('active')}
function showReader(){$('textView').classList.add('hidden');$('home').classList.add('hidden');$('reader').classList.remove('hidden');$('navRead').classList.add('active');$('navHome').classList.remove('active');if(pdf)setTimeout(render,50)}
function openReaderPicker(){showReader();setTimeout(()=>$('file').click(),80)}
async function convertText(){
 if(!pdf){$('status').textContent='먼저 PDF를 열어주세요.';return}
 $('ocr').disabled=true;$('ocr').textContent='변환 중…';$('status').textContent='현재 페이지 텍스트 추출 중…';
 try{
  const pg=await pdf.getPage(p),tc=await pg.getTextContent();
  let txt=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();
  if(!txt){txt='이 페이지에는 추출 가능한 텍스트 레이어가 없습니다. 스캔 이미지 OCR은 다음 단계에서 서버 OCR로 연결합니다.'}
  $('ocrText').textContent=txt;$('ocrStatus').textContent='원본 PDF '+p+'페이지 · '+txt.length+'자';
  $('reader').classList.add('hidden');$('home').classList.add('hidden');$('textView').classList.remove('hidden');
  $('navRead').classList.add('active');$('navHome').classList.remove('active');
 }catch(e){$('status').textContent='텍스트 변환 오류: '+e.message}
 finally{$('ocr').disabled=false;$('ocr').textContent='OCR 텍스트 변환'}
}
$('ocr').onclick=convertText;

async function render(){if(!pdf)return;if(rendering){pending=true;return}rendering=true;$('status').textContent='페이지 렌더링 중…';
try{const page=await pdf.getPage(p);const base=page.getViewport({scale:1});const availW=Math.max(120,stage.clientWidth-24),availH=Math.max(160,window.innerHeight*.64);let s=scale;
if(mode==='fit')s=Math.min(availW/base.width,availH/base.height);else if(mode==='width')s=availW/base.width;
const v=page.getViewport({scale:s});const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(v.width*dpr);canvas.height=Math.floor(v.height*dpr);canvas.style.width=Math.floor(v.width)+'px';canvas.style.height=Math.floor(v.height)+'px';
const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport:v,transform:[dpr,0,0,dpr,0,0],background:'white'}).promise;
$('page').textContent=p+' / '+pdf.numPages;$('zoom').textContent=Math.round(s*100)+'%';$('status').textContent='정상 표시 · '+pdf.numPages+'페이지';if($('homeMeta'))$('homeMeta').textContent=pdf.numPages+'페이지 · 현재 '+p+'페이지';if($('homeProgress'))$('homeProgress').style.width=Math.round(p/pdf.numPages*100)+'%';loadNote();
}catch(e){$('status').textContent='표시 오류: '+e.message;console.error(e)}finally{rendering=false;if(pending){pending=false;render()}}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('status').textContent='PDF 불러오는 중…';bytes=new Uint8Array(await f.arrayBuffer());key='sg-note-'+f.name;pdf=await pdfjsLib.getDocument({data:bytes,disableAutoFetch:false,useSystemFonts:true}).promise;p=1;mode='fit';$('homeBook').textContent=f.name.replace(/\.pdf$/i,'');$('homeMeta').textContent=pdf.numPages+'페이지 · 현재 1페이지';showReader();await render()}catch(err){$('status').textContent='PDF 열기 실패: '+err.message;console.error(err)}};
$('prev').onclick=()=>{if(pdf&&p>1){saveNote();p--;render()}};$('next').onclick=()=>{if(pdf&&p<pdf.numPages){saveNote();p++;render()}};
$('plus').onclick=()=>{mode='manual';scale=Math.min(3,scale+.15);render()};$('minus').onclick=()=>{mode='manual';scale=Math.max(.35,scale-.15);render()};
$('fit').onclick=()=>{mode='fit';render()};
$('width').onclick=()=>{mode='width';render()};
function saveNote(){if(key)localStorage.setItem(key+'-'+p,$('note').value)}function loadNote(){$('note').value=key?(localStorage.getItem(key+'-'+p)||''):''}$('note').addEventListener('input',saveNote);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(pdf&&mode!=='manual')render()},120)});
</script></body></html>
